# Replaces the old .gitlab-ci.yml, which was written for GitLab CI but this
# repo's actual remote is GitHub - .gitlab-ci.yml is never recognized or run
# here. typecheck -> build -> test on every push/PR touching adapted-backend,
# blocking a merge on any failing job.
name: Backend CI

"on":
  push:
    branches: [main]
    paths:
      - "adapted-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "adapted-backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: adapted-backend

env:
  NODE_ENV: test

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: adapted-backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: adapted-backend/package-lock.json
      - run: npm ci
      - run: npm run build

  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: adapted-backend/package-lock.json
      - run: npm ci
      - run: npm test

  # Closes the "today's tests are 100% mocked" gap from the B6 plan - a real
  # Postgres service container, migrations applied, then the actual server
  # (via tsx, exactly like dev/prod - see tests/integration/globalSetup.js
  # for why not in-process) exercised over real HTTP.
  integration_tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: adapted_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: adapted_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: adapted_ci
      DB_USER: postgres
      DB_PASSWORD: adapted_ci_password
      JWT_SECRET: github-actions-ci-only-secret-at-least-32-characters-long
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: adapted-backend/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:integration
